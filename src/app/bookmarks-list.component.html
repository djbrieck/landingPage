<div class="bookmarks-list">
@for (b of sortedBookmarks; track b.id) {
    <div class="bookmark-item">
        @if (editingBookmark()?.id === b.id) {
            <form class="edit-form" (submit)="$event.preventDefault(); saveEdit();">
                <input type="text" [value]="editTitle()" #titleInput (input)="setEditTitle(titleInput.value)" name="title" placeholder="Title" required />
                <div class="error" *ngIf="editErrors().title">{{ editErrors().title }}</div>
                <input type="url" [value]="editUrl()" #urlInput (input)="setEditUrl(urlInput.value)" name="url" placeholder="URL" required />
                <div class="error" *ngIf="editErrors().url">{{ editErrors().url }}</div>
                <button type="submit">Save</button>
                <button type="button" (click)="cancelEdit()">Cancel</button>
            </form>
        } @else {
            <div class="bookmark-link" (click)="onLinkClick(b)">
                <span class="title">{{ b.title }}</span>
                <span class="url">{{ b.url }}</span>
                <span class="count">({{ b.clickCount }})</span>
            </div>
            <div class="dropdown" (click)="$event.stopPropagation()">
                <button (click)="openDropdown(b.id)">⋮</button>
                @if (dropdownOpen() === b.id) {
                    <div class="dropdown-menu">
                        <button (click)="editBookmark(b)">Edit</button>
                        <button (click)="deleteBookmark(b.id)">Delete</button>
                    </div>
                }
            </div>
        }
    </div>
}
</div>
